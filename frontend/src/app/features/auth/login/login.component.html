<div class="login-container">

    <div class="login-card">

        <h1>GameVault</h1>
        <p>Entre na sua conta para continuar</p>

        <form (ngSubmit)="entrar()">

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" [(ngModel)]="senha" placeholder="Digite sua senha"
                    required>
            </div>

            <p class="erro" *ngIf="erro">
                {{ erro }}
            </p>

            <button type="submit" [disabled]="carregando">
                {{ carregando ? 'Entrando...' : 'Entrar' }}
            </button>

        </form>

    </div>

</div>
