spring.application.name=GameVault

# ===== Banco de dados (PostgreSQL) =====
# Cada pessoa do grupo pode usar a propria senha sem editar este arquivo:
# basta criar a variavel de ambiente DB_PASSWORD (no IntelliJ: Run > Edit Configurations > Environment variables).
# Se a variavel nao existir, usa o valor depois dos dois-pontos.
spring.datasource.url=jdbc:postgresql://localhost:5432/gamevault
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SUA_SENHA}

# update = o Hibernate cria/atualiza as TABELAS sozinho a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# ===== JWT =====
# Chave secreta em Base64 (minimo 256 bits). Em producao, troque e use a variavel JWT_SECRET.
jwt.secret=${JWT_SECRET:R2FtZVZhdWx0LUNoYXZlLVNlY3JldGEtUGFyYS1KV1QtUHJvamV0by1JbnRlZ3JhZG9yLTIwMjY=}
# Validade do token em milissegundos (86400000 = 24 horas)
jwt.expiration=86400000
